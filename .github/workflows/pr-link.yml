name: Linked task

# Rule: every pull request names the task it belongs to (a line like "Closes #12" in its description).
# That is what makes it show up next to the card on the board, under "Linked pull requests",
# and what closes the task when the pull request is merged.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  linked-task:
    runs-on: ubuntu-latest
    steps:
      - name: Pull request is linked to its task
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # GitHub needs a moment to register a link after the description changes, so look a few times.
          for try in 1 2 3 4; do
            n=$(gh pr view "$PR" --repo "$REPO" --json closingIssuesReferences --jq '.closingIssuesReferences | length')
            [ "$n" -gt 0 ] && break
            sleep 5
          done
          if [ "$n" -gt 0 ]; then
            echo "Linked to $n task(s)."
          else
            echo "::error::This pull request is not linked to a task. Edit its description and add a line like: Closes #12"
            exit 1
          fi
