name: CI

# Runs when code is pushed. Notes-only pushes (vault/) don't trigger a run.
on:
  pull_request:
    paths-ignore: ['vault/**']
  push:
    branches: [main]
    paths-ignore: ['vault/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same check that runs on everyone's computer before `git sync`
      - name: No secrets, conflicts, huge files or broken notebooks
        run: sh scripts/check.sh

      - if: hashFiles('requirements.txt') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install and test
        if: hashFiles('requirements.txt') != ''
        run: |
          pip install -r requirements.txt pytest
          if [ -d tests ]; then pytest -q; else echo "no tests/ yet"; fi
