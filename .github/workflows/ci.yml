name: CI

# Runs when code is pushed. Notes-only pushes (vault/) don't trigger a run.
on:
  pull_request:
    paths-ignore: ['vault/**']
  push:
    branches: [main]
    paths-ignore: ['vault/**']

# Pull requests: a newer push cancels the older run. Pushes to main: every commit gets
# its own run, so a teammate's push never cancels the check on yours.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same check that runs on everyone's computer before `git sync`
      - name: No secrets, conflicts, huge files or broken notebooks
        run: sh scripts/check.sh

      - if: hashFiles('requirements.txt') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install and test
        if: hashFiles('requirements.txt') != ''
        run: |
          pip install -r requirements.txt pytest
          # pytest exits with 5 when tests/ has no tests yet. That is fine, not a failure.
          if [ -d tests ]; then pytest -q || [ $? -eq 5 ]; else echo "no tests/ yet"; fi
